[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "iwatch-calories"
version = "0.1.0"
description = "Offline calorie consumption analysis for Apple Watch (iWatch) health exports"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
iwatch-calories = "iwatch_calories.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
